    CreateBizonylatRequestType:
      type: object
      properties:
        bizonylatTipus:
          description:
            A bizonylat típusának azonosítója, pl T1042E.
            A nav-gov-hu-templates Github oldalakon lévő XSD fájlokban lévő namespace-ből kell venni az értéket.
            Ennek az azonosítónak egyeznie kell a beküldött xml namespace-ben lévő bizonylat azonosítóval.
            Amennyiben nem egyezik az itt megadott érték a beküldött xml namespace-ben lévővel, úgy a válaszban XSD validációs hiba fog visszaérkezni.
          type: string
          maxLength: 100
        bizonylatVerzio:
          description:
            A bizonylat verziószáma, pl 1.0.
            A nav-gov-hu-templates Github oldalakon lévő XSD fájlokban lévő namespace-ből kell venni az értéket.
            Ennek az azonosítónak egyeznie kell a beküldött xml namespace-ben lévő bizonylat verzióval.
            Amennyiben nem egyezik az itt megadott érték a beküldött xml namespace-ben lévővel, úgy a válaszban XSD validációs hiba fog visszaérkezni.
          type: string
          maxLength: 10
          pattern: ^[A-Za-z0-9.\-_]{1,10}$
        bizonylatXml:
          description: >-
            A bizonylat file base 64 kódolással. A tomorites paraméter adja,
            meg, hogy tömörtett volt-e a fájl, és ha igen, akkor milyen módon,
            mielőtt kódolva lett.
          type: string
          format: byte
        megjegyzes:
          description: >-
            A bizonylathoz fűzhető megjegyzés, ami megadása esetén bekerül a
            nyugtába, hasonlóan az ÁNYK-s működéshez.
          type: string
          maxLength: 2000
        signature:
          description: >-
            Aláírás.  A műveletfüggő érték a bizonylat xml SHA256 hashelt
            értéke.
          type: string
          maxLength: 200
        valaszTarhelyAzonosito:
          description: >-
            Annak a tárhelynek az azonosítója, ahová a beküldő a nyugtákat
            várja. Akkor kell megadni, ha hivatal a beküldő, és nem a
            felhasználói regisztráció során megadott tárhelyre szeretné kapni a
            nyugtákat.
          type: string
        validaciosTanusitvany:
          description: >-
            Annak a tanúsítványa, hogy a beküldött bizonylat már validálva lett.
            Ha létezik ilyen tanúsítvány, akkor a bizonylat a beküldés során már
            nem lesz validálva. Gyorsabban lefut a művelet, ami szinkronválaszt
            ad. A tanúsítvány mező az elején pontosvesszővel elválasztva
            tartalmazza azokat az adatokat, amelyekből képezve lett. A végére
            kerül a maga a tanúsítvány base64 kódolva.
          type: string
          maxLength: 500
        tomorites:
          $ref: '#/components/schemas/Tomorites'
      required:
        - bizonylatTipus
        - bizonylatVerzio
        - bizonylatXml
        - signature

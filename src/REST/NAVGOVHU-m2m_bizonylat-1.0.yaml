    GetKalkulacioResponseType:
      allOf:
        - $ref: '#/components/schemas/KalkulacioResponseType'
        - type: object
          properties:
            resultCode:
              $ref: '#/components/schemas/GetKalkulacioResult'
    KalkulacioResponseType:
      allOf:
        - $ref: '#/components/schemas/BaseResponseType'
        - type: object
          properties:
            bizonylatXml:
              description: >-
                A kalkulált számított mezőket  tartalmazó bizonylat file base 64
                kódolással és bzip2 tömörítéssel.
              type: string
              format: byte
            kalkulaciosHiba:
              $ref: '#/components/schemas/KalkulaciosHiba'
            bizonylatKalkulacioStatusz:
              $ref: '#/components/schemas/BizonylatKalkulacioStatusz'
      required:
        - bizonylatKalkulacioStatusz
    KalkulaciosHiba:
      type: object
      properties:
        hibaKod:
          description: A hiba típusa
          type: string
        hibaUzenet:
          description: A hiba leírása
          type: string
        mezoAzonosito:
          description: Az érintett mező azonosítója
          type: string
        szabalyAzonosito:
          description: A hibát okozó szabály azonosítója
          type: string
    CreateValidacioResponseType:
      allOf:
        - $ref: '#/components/schemas/ValidacioResponseType'
        - type: object
          properties:
            ugyAzonosito:
              description: >-
                A validáció azonosítója. Ezzel lehet lekérdezni validáció
                kezdeményezését követően a státuszt.
              type: string
            resultCode:
              $ref: '#/components/schemas/CreateValidacioResult'
      required:
        - ugyAzonosito
    CreateValidacioResult:
      type: string
      enum:
        - ERVENYTELEN_ALAIRAS
        - ERVENYTELEN_BIZONYLAT_TIPUS
        - ERVENYTELEN_BIZONYLAT_VERZIO
        - HIBAS_TOMORITES
        - SIKERES
        - VALIDACIOS_HIBA
        - EGYEB_HIBA
        - ERVENYTELEN_KODOLAS
        - ERVENYTELEN_KARAKTER
        - NEM_XSD_VALID_XML
        - HIBAS_XML_FORMATUM
    GetValidacioResponseType:
      allOf:
        - $ref: '#/components/schemas/ValidacioResponseType'
        - type: object
          properties:
            resultCode:
              $ref: '#/components/schemas/GetValidacioResult'
    GetValidacioResult:
      type: string
      enum:
        - ERVENYTELEN_ALAIRAS
        - ERVENYTELEN_BIZONYLAT_TIPUS
        - ERVENYTELEN_BIZONYLAT_VERZIO
        - HIBAS_TOMORITES
        - SIKERES
        - VALIDACIOS_HIBA
        - EGYEB_HIBA
        - ERVENYTELEN_KODOLAS
        - ERVENYTELEN_KARAKTER
        - NEM_XSD_VALID_XML
        - HIBAS_XML_FORMATUM
        - NEMLETEZO_UGY_AZONOSITO
    ValidacioResponseType:
      allOf:
        - $ref: '#/components/schemas/BaseResponseType'
        - type: object
          properties:
            validaciosHibak:
              description: >-
                Hibákat megállapító validáció esetén a hibákat tartalmazó xml
                fájl bzip2-vel tömörítve. Az xml a hibalista.xsd-vel dolgozható
                fel.
              type: string
              format: byte
            validaciosTanusitvany:
              description: >-
                Annak a tanúsítványa, hogy a beküldött bizonylat már validálva
                lett. Ha létezik ilyen tanúsítvány, akkor a bizonylat a beküldés
                során már nem lesz validálva. Gyorsabban lefut a beküldés
                művelet.
              type: string
            bizonylatValidacioStatusz:
              $ref: '#/components/schemas/BizonylatValidacioStatusz'
      required:
        - bizonylatValidacioStatusz
